<!doctype html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="UTF-8" />
<title>lockup fixture</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Marcellus&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../css/style.css" />
<style>
  /* A still room for the mark to be photographed in.
     The lockups on the live page sit over an animated, scroll-driven gradient
     and inside parallax layers, so their pixels moved whenever anything above
     them changed height. Four rounds of chasing that produced a baseline that
     failed on edits nowhere near the logo — which is worse than no baseline,
     because the habit it teaches is to re-record until green.
     Geometry is still asserted against the real page (logo-lockup.spec.mjs).
     This file exists only so the STROKE, COLOUR and SHAPE have somewhere
     deterministic to be compared. */
  html, body { background: #0B3A4A; margin: 0; }
  .ocean, .grade, .grain { display: none !important; }
  .stage { padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  /* The footer lockup is normally a grid item; give it the same container. */
  .foot__brand { background: none; }
</style>
</head>
<body>
  <div class="stage">
    <!-- Kept byte-identical to index.html; tests/lockup-fixture.spec.mjs fails
         if the page and this file ever drift apart. -->
    <a class="nav__brand" id="navLockup" href="#top" aria-label="ZEN DIVE Manila トップへ">
      <svg class="maru nav__maru" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="100" stroke-dasharray="90 10" transform="rotate(-18 24 24)"/></svg>
      <span class="nav__lockup">
        <span class="nav__word">ZEN DIVE</span>
        <span class="nav__city" aria-label="MANILA"><i>M</i><i>A</i><i>N</i><i>I</i><i>L</i><i>A</i></span>
      </span>
    </a>

    <div class="foot__brand" id="footLockup">
      <span class="foot__kanji"><svg class="maru foot__maru" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="100" stroke-dasharray="90 10" transform="rotate(-18 24 24)"/></svg></span>
      <span class="foot__lockup"><span class="foot__word">ZEN DIVE</span><span class="foot__city" aria-label="MANILA"><i>M</i><i>A</i><i>N</i><i>I</i><i>L</i><i>A</i></span></span>
    </div>
  </div>
</body>
</html>
