<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&amp;display=swap');
      .maru-ring {
        fill: none;
        stroke: #F1EADC;
        stroke-width: 3.2;
        stroke-linecap: round;
      }
      .wordmark {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #F1EADC;
        letter-spacing: 0.34em;
      }
      .citymark {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 18.6px;
        fill: #A7D7D2;
        letter-spacing: 0.82em;
      }
    </style>
  </defs>
  <!-- Mark (Maru / Enso) -->
  <g transform="translate(16, 15)">
    <svg width="60" height="60" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21" class="maru-ring" pathLength="100" stroke-dasharray="90 10" transform="rotate(-18 24 24)" />
    </svg>
  </g>
  <!-- Lockup Text -->
  <g transform="translate(94, 42)">
    <text x="0" y="0" class="wordmark">ZEN DIVE</text>
    <text x="0" y="26" class="citymark">MANILA</text>
  </g>
</svg>
